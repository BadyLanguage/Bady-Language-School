<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bady Language Schools — Weekly Timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A2333;
  --ink-soft:#4B5568;
  --paper:#EEF0EA;
  --paper-raised:#FFFFFF;
  --line:#D8DBCF;
  --gold:#AD7B26;
  --lang:#2F6F62;
  --stem:#2C4A8C;
  --human:#8C4A2C;
  --art:#7A4E8C;
  --break-bg:#E4E1D6;
  --radius:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDEFEA; --ink-soft:#AEB4A6; --paper:#161A15; --paper-raised:#20241E;
    --line:#333828; --break-bg:#262B22;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEFEA; --ink-soft:#AEB4A6; --paper:#161A15; --paper-raised:#20241E;
  --line:#333828; --break-bg:#262B22;
}
*{margin:0;padding:0;box-sizing:border-box; min-width:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
img,svg{max-width:100%;}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Nunito',sans-serif;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:1000px;margin:0 auto;padding:2.5rem 1.5rem 4rem; overflow-wrap:break-word;}
header.hero{margin-bottom:2.25rem;}
.eyebrow{
  font-family:'Nunito',sans-serif; font-size:.8rem; color:var(--gold);
  font-weight:600; letter-spacing:.02em; margin-bottom:.6rem;
}
h1{
  font-family:'Baloo 2',sans-serif; font-weight:600; font-size:clamp(2rem,5vw,2.9rem);
  line-height:1.08; letter-spacing:-.01em; max-width:14ch;
}
h1 em{font-style:italic; color:var(--gold); font-weight:500;}
.sub{
  margin-top:.9rem; font-size:1.05rem; color:var(--ink-soft); max-width:52ch; line-height:1.55;
}
.stage-tabs{
  display:flex; gap:.5rem; margin:2rem 0 1rem; flex-wrap:wrap;
  border-bottom:1px solid var(--line); padding-bottom:0;
}
.stage-tab{
  font-family:'Nunito',sans-serif; font-size:.95rem; font-weight:600; color:var(--ink-soft);
  background:none; border:none; padding:.6rem .2rem; cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.stage-tab.active{color:var(--ink); border-bottom-color:var(--gold);}
.class-grid{
  display:flex; flex-wrap:wrap; gap:.5rem; margin:1.1rem 0 2rem;
}
.class-chip{
  font-family:'Nunito',sans-serif; font-size:.92rem; font-weight:500; color:var(--ink);
  background:var(--paper-raised); border:1px solid var(--line); border-radius:8px;
  padding:.5rem 1rem; cursor:pointer;
}
.class-chip.active{background:var(--ink); color:var(--paper-raised); border-color:var(--ink);}
.class-chip:hover:not(.active){border-color:var(--gold);}

.panel{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden;
}
.panel-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:1rem;
  padding:1.3rem 1.5rem; border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.panel-head h2{
  font-family:'Baloo 2',sans-serif; font-weight:600; font-size:1.6rem;
}
.panel-head .meta{font-size:.85rem; color:var(--ink-soft);}
.print-btn{
  font-family:'Nunito',sans-serif; font-size:.85rem; font-weight:600; color:var(--ink);
  background:var(--paper); border:1px solid var(--line); border-radius:7px;
  padding:.5rem .9rem; cursor:pointer;
}
.print-btn:hover{border-color:var(--gold);}

.table-scroll{overflow-x:auto;}
table.tt{width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; min-width:760px;}
table.tt th, table.tt td{
  border-bottom:1px solid var(--line); border-right:1px solid var(--line);
  padding:.9rem .5rem; font-size:.86rem; line-height:1.35; text-align:center; vertical-align:middle;
  overflow-wrap:break-word; hyphens:auto;
}
table.tt th:last-child, table.tt td:last-child{border-right:none;}
table.tt tbody tr:last-child td{border-bottom:none;}
table.tt tbody tr:nth-child(even) td.subject,
table.tt tbody tr:nth-child(even) td.subject.empty{background:color-mix(in srgb, var(--paper) 45%, var(--paper-raised));}
table.tt thead th{
  font-family:'Nunito',sans-serif; font-weight:600; color:var(--ink-soft); font-size:.76rem;
  letter-spacing:.02em; background:var(--paper); padding:.8rem .6rem; border-bottom:1px solid var(--line);
}
table.tt thead th.today{color:var(--gold);}
table.tt td.period-col, table.tt th.period-col{
  font-family:'Baloo 2',sans-serif; font-weight:600; color:var(--ink-soft); font-size:.92rem;
  width:6.5rem; background:var(--paper); border-right:1px solid var(--line);
}
table.tt td.period-col.today{color:var(--gold); background:color-mix(in srgb, var(--gold) 10%, var(--paper));}
table.tt td.subject{font-weight:500; height:3.4rem;}
table.tt td.subject.empty{color:var(--line); font-weight:400;}
table.tt td.subject .dot{
  display:inline-block; width:.4rem; height:.4rem; border-radius:50%; margin-right:.4rem;
  vertical-align:middle; flex:none;
}
table.tt td.subject{white-space:normal;}
table.tt td.brk{
  background:var(--break-bg); color:var(--ink-soft); font-style:italic; font-size:.76rem;
  width:3.6rem;
}
table.tt th.brk-head{width:3.6rem;}


.legend{display:flex; flex-wrap:wrap; gap:1rem; padding:1rem 1.5rem 1.4rem; font-size:.78rem; color:var(--ink-soft);}
.legend span{display:inline-flex; align-items:center; gap:.4rem;}
.legend .dot{width:.5rem; height:.5rem; border-radius:50%; display:inline-block;}

footer{margin-top:2.5rem; font-size:.82rem; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:1.2rem;}

@media print{
  .stage-tabs,.class-grid,.hero,.print-btn,footer{display:none !important;}
  body{background:#fff;}
  .panel{border:none;}
  .wrap{padding:0;max-width:100%;}
}

.admin-bar{display:flex; gap:.5rem; align-items:center;}
.edit-btn{font-family:'Nunito',sans-serif; font-size:.85rem; font-weight:600; color:#fff; background:var(--gold); border:1px solid var(--gold); border-radius:7px; padding:.5rem .9rem; cursor:pointer;}
.edit-btn.on{background:var(--ink); border-color:var(--ink);}
table.tt td.subject.editable{cursor:pointer;}
table.tt td.subject.editable:hover{outline:2px dashed var(--gold); outline-offset:-2px;}
.save-toast{position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper-raised); font-family:'Nunito',sans-serif; font-size:.85rem; font-weight:600; padding:.6rem 1.1rem; border-radius:8px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50;}
.save-toast.show{opacity:1;}
.editor-overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:60; padding:1rem;}
.editor-box{background:var(--paper-raised); border-radius:12px; padding:1.4rem; width:min(320px,90vw); box-shadow:0 12px 40px rgba(0,0,0,.25);}
.editor-box h3{font-family:'Baloo 2',sans-serif; font-size:1.05rem; margin-bottom:.9rem; font-weight:600;}
.editor-box select, .editor-box input{width:100%; font-family:'Nunito',sans-serif; font-size:.95rem; padding:.55rem .6rem; border:1px solid var(--line); border-radius:7px; margin-bottom:.7rem; background:var(--paper); color:var(--ink);}
.editor-actions{display:flex; gap:.5rem; justify-content:flex-end;}
.editor-actions button{font-family:'Nunito',sans-serif; font-weight:600; font-size:.85rem; padding:.5rem .9rem; border-radius:7px; border:1px solid var(--line); background:var(--paper); cursor:pointer; color:var(--ink);}
.editor-actions button.primary{background:var(--gold); border-color:var(--gold); color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">Bady Language Schools</div>
    <h1>This week's timetable, <em>one link away.</em></h1>
    <p class="sub">Pick a class below to see its schedule.</p>
  </header>

  <div class="stage-tabs" id="stageTabs"></div>
  <div class="class-grid" id="classGrid"></div>

  <section class="panel" id="panel">
    <div class="panel-head">
      <div>
        <h2 id="className">—</h2>
        <div class="meta" id="classMeta"></div>
      </div>
      <div class="admin-bar">
        <button class="edit-btn" id="editToggle" style="display:none" onclick="toggleEditMode()">Edit mode: Off</button>
        <button class="print-btn" onclick="window.print()">Print this timetable</button>
      </div>
    </div>
    <div class="table-scroll">
      <table class="tt" id="ttTable"></table>
    </div>
  </section>

  <footer>Last update: September 26, 2026<br>Generated from the school's official weekly schedule. Data may be updated by the school office as classes change.</footer>
</div>
<div class="save-toast" id="saveToast"></div>
<div id="editorRoot"></div>

const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday"];
const TODAY = DAYS[new Date().getDay()] || null;

function stageOf(name){
  if(name.startsWith("Prim")) return "Primary";
  if(name.startsWith("Prep")) return "Preparatory";
  if(name.startsWith("Sec")) return "Secondary";
  return "Other";
}
function gradeSort(name){
  const m = name.match(/([A-Za-z]+)\.(\d+)([A-Z])/);
  return m ? [m[1], parseInt(m[2]), m[3]] : [name,0,""];
}

const classNames = Object.keys(DATA).sort((a,b)=>{
  const ga=gradeSort(a), gb=gradeSort(b);
  if(ga[1]!==gb[1]) return ga[1]-gb[1];
  return ga[2]<gb[2]?-1:1;
});
const stages = ["Primary","Preparatory","Secondary"];
let activeStage = "Primary";
let activeClass = classNames.find(n=>stageOf(n)===activeStage);

const CATS = [
  {test:/english|arabic|second language|phonics|story/i, color:"var(--lang)", label:"Languages"},
  {test:/math|science|ict|computer|programming|physics|chemistry/i, color:"var(--stem)", label:"STEM"},
  {test:/history|social|religion|financial|philosophy/i, color:"var(--human)", label:"Humanities"},
  {test:/art|music|p\.e\.|library/i, color:"var(--art)", label:"Creative & PE"},
];
function catFor(subject){
  for(const c of CATS) if(c.test.test(subject)) return c;
  return null;
}

function renderStageTabs(){
  const el = document.getElementById('stageTabs');
  el.innerHTML = stages.map(s=>`<button class="stage-tab${s===activeStage?' active':''}" data-stage="${s}">${s}</button>`).join('');
  el.querySelectorAll('.stage-tab').forEach(btn=>{
    btn.onclick = ()=>{
      activeStage = btn.dataset.stage;
      const first = classNames.find(n=>stageOf(n)===activeStage);
      if(first) activeClass = first;
      renderAll();
    };
  });
}

function renderClassGrid(){
  const el = document.getElementById('classGrid');
  const inStage = classNames.filter(n=>stageOf(n)===activeStage);
  el.innerHTML = inStage.map(n=>`<button class="class-chip${n===activeClass?' active':''}" data-class="${n}">${n}</button>`).join('');
  el.querySelectorAll('.class-chip').forEach(btn=>{
    btn.onclick = ()=>{ activeClass = btn.dataset.class; renderAll(); };
  });
}

function renderTable(){
  document.getElementById('className').textContent = activeClass;
  document.getElementById('classMeta').textContent = activeStage + ' · ' + classNames.filter(n=>stageOf(n)===activeStage).length + ' classes in this stage';

  const sched = DATA[activeClass];
  const firstDay = sched[DAYS.find(d=>sched[d])];
  const cols = firstDay.map(pair=>pair[0]); // ordered period labels, e.g. ["1","2","3","Break","4",...]

  // rows = days (day name in the left/number spot), columns = periods
  // merge consecutive periods with the identical subject into one spanned cell (matches the school's original PDF layout)
  let rows = DAYS.map(day=>{
    const periodPairs = sched[day] || [];
    const valAt = idx => (periodPairs[idx] ? periodPairs[idx][1] : '');
    let cells = '';
    let i = 0;
    while(i < cols.length){
      const col = cols[i];
      if(col === 'Break'){
        cells += `<td class="brk">Break</td>`;
        i++;
        continue;
      }
      const v = valAt(i);
      let span = 1;
      while(i+span < cols.length && cols[i+span] !== 'Break' && valAt(i+span) === v){
        span++;
      }
      if(!v){
        cells += `<td class="subject empty" colspan="${span}" data-day="${day}" data-start="${i}" data-span="${span}">—</td>`;
      } else {
        const cat = catFor(v);
        const dot = cat ? `<span class="dot" style="background:${cat.color}"></span>` : '';
        cells += `<td class="subject" colspan="${span}" data-day="${day}" data-start="${i}" data-span="${span}">${dot}${v}</td>`;
      }
      i += span;
    }
    return `<tr><td class="period-col${day===TODAY?' today':''}">${day}</td>${cells}</tr>`;
  }).join('');

  let periodHeadRow = '<th class="period-col"></th>' + cols.map(c=>`<th class="${c==='Break'?'brk-head':''}">${c==='Break'?'Break':c}</th>`).join('');

  document.getElementById('ttTable').innerHTML =
    '<thead><tr>'+periodHeadRow+'</tr></thead><tbody>'+rows+'</tbody>';

}

function renderAll(){
  renderStageTabs();
  renderClassGrid();
  renderTable();
  attachEditHandlers();
}
renderAll();
initCaps();


// ---------- Edit mode (admin only) + self-publishing ----------
let editMode = false;
let canEditPage = false;
let artifactCap = null;
let userCap = null;

function attachEditHandlers(){
  document.querySelectorAll('#ttTable td.subject').forEach(td=>{
    td.classList.toggle('editable', editMode);
    td.onclick = editMode ? (()=>openEditor(td)) : null;
  });
}

function toggleEditMode(){
  editMode = !editMode;
  const btn = document.getElementById('editToggle');
  btn.textContent = 'Edit mode: ' + (editMode ? 'On' : 'Off');
  btn.classList.toggle('on', editMode);
  attachEditHandlers();
}

function allKnownSubjects(){
  const set = new Set();
  Object.values(DATA).forEach(cls=>{
    Object.values(cls).forEach(day=>{
      day.forEach(p=>{ if(p[1] && p[1] !== 'Break') set.add(p[1]); });
    });
  });
  return Array.from(set).sort();
}

function openEditor(td){
  const day = td.dataset.day, start = parseInt(td.dataset.start,10), span = parseInt(td.dataset.span,10);
  const current = (DATA[activeClass][day][start] || [null,''])[1] || '';
  const subjects = allKnownSubjects();
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const root = document.getElementById('editorRoot');
  root.innerHTML = '<div class="editor-overlay" id="editorOverlay">' +
    '<div class="editor-box">' +
      '<h3>' + esc(activeClass) + ' — ' + esc(day) + '</h3>' +
      '<select id="subjectSelect">' +
        '<option value="">— empty —</option>' +
        subjects.map(s=>'<option value="'+esc(s)+'"'+(s===current?' selected':'')+'>'+esc(s)+'</option>').join('') +
        '<option value="__custom__">Custom…</option>' +
      '</select>' +
      '<input type="text" id="customInput" placeholder="Custom subject name" style="display:none">' +
      '<div class="editor-actions">' +
        '<button onclick="closeEditor()">Cancel</button>' +
        '<button class="primary" id="saveEditorBtn">Save</button>' +
      '</div>' +
    '</div></div>';
  document.getElementById('subjectSelect').onchange = (e)=>{
    document.getElementById('customInput').style.display = e.target.value === '__custom__' ? 'block' : 'none';
  };
  document.getElementById('saveEditorBtn').onclick = ()=> saveEditor(day, start, span);
  document.getElementById('editorOverlay').onclick = (e)=>{ if(e.target.id === 'editorOverlay') closeEditor(); };
}

function closeEditor(){
  document.getElementById('editorRoot').innerHTML = '';
}

function saveEditor(day, start, span){
  const sel = document.getElementById('subjectSelect').value;
  const custom = document.getElementById('customInput').value.trim();
  const value = sel === '__custom__' ? custom : sel;
  for(let k=0;k<span;k++){
    if(DATA[activeClass][day][start+k]) DATA[activeClass][day][start+k][1] = value;
  }
  closeEditor();
  renderTable();
  attachEditHandlers();
  publishUpdate();
}

function showToast(msg){
  const t = document.getElementById('saveToast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

function b64ToUtf8(b64){
  const binStr = atob(b64);
  const bytes = Uint8Array.from(binStr, c=>c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

function buildDoc(){
  const raw = b64ToUtf8(TEMPLATE_B64);
  return raw
    .replace('%%DATA%%', ()=>JSON.stringify(DATA))
    .replace('%%TEMPLATE%%', ()=>TEMPLATE_B64);
}

async function publishUpdate(){
  if(!artifactCap){
    showToast('Change made, but not connected to save — refresh may lose it');
    return;
  }
  try{
    await artifactCap.publish(buildDoc());
    showToast('Saved — everyone sees the update');
  }catch(e){
    showToast('Could not save (' + (e && e.code ? e.code : 'error') + ')');
  }
}

async function initCaps(){
  try{
    if(window.claude && window.claude.use){
      userCap = await window.claude.use('user');
      artifactCap = await window.claude.use('artifact');
    }
  }catch(e){}
  canEditPage = !!(userCap && userCap.canEdit && userCap.canEdit());
  const btn = document.getElementById('editToggle');
  if(btn) btn.style.display = canEditPage ? 'inline-block' : 'none';
}

</script>
</body>
